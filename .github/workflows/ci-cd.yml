name: CI/CD

# Un solo workflow con dos jobs (test -> deploy) en vez de dos workflows
# separados: así "deploy" solo puede arrancar si "test" ya pasó en el MISMO
# commit (needs: test), sin depender de workflow_run ni de ninguna otra
# forma de disparo asíncrono que pueda competir o publicar una versión
# distinta a la que realmente se probó.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas, lint y seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Instalar dependencias de Python (dev)
        run: pip install -r requirements-dev.txt

      - name: Build (CSS/JS minificados)
        run: npm run build

      - name: Lint JS (eslint)
        run: npx eslint .

      - name: Lint CSS (stylelint)
        run: npx stylelint "**/*.css"

      - name: Validar HTML (html-validate)
        run: npx html-validate index.html

      - name: Lint Python (flake8)
        run: python -m flake8 app.py tests/ --max-line-length=100

      - name: Seguridad estática Python (bandit)
        run: python -m bandit -r app.py -q

      - name: Pruebas backend (pytest)
        run: python -m pytest -q

      - name: Auditoría de dependencias npm (producción)
        # --omit=dev: el frontend publicado no usa ninguna dependencia de
        # npm en tiempo de ejecución (es JS/CSS propio, sin librerías), así
        # que esto comprueba que siga siendo así. Las 7 vulnerabilidades
        # "high" conocidas en `braces` son transitivas de herramientas de
        # desarrollo (stylelint) sin fix upstream — ver CLAUDE.md,
        # "Limitaciones conocidas" — y quedan fuera a propósito de este
        # comando, no ocultas: siguen siendo visibles en `npm audit` sin
        # --omit=dev y documentadas.
        run: npm audit --omit=dev

      - name: Auditoría de dependencias Python
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Pruebas E2E + accesibilidad (Playwright)
        run: npx playwright test --reporter=line
        env:
          CI: true

      - name: Verificar enlaces internos
        run: node .github/scripts/check-internal-links.mjs

      - name: Verificar recursos a publicar
        run: node .github/scripts/check-production-files.mjs

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Publicar en GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias de Node
        run: npm ci

      - name: Build (CSS/JS minificados)
        run: npm run build

      - name: Preparar artefacto de producción
        # Copia SOLO los archivos estáticos que debe servir GitHub Pages
        # (ver DEPLOYMENT.md, "Qué se publica") — explícitamente excluye
        # app.py, requirements*.txt, .env*, .venv/, node_modules/, tests/,
        # los .css/.js fuente sin minificar, los borradores legales
        # (privacidad.html, terminos.html, legal.css) y la documentación
        # interna (CLAUDE.md, configs de linters).
        run: node .github/scripts/stage-production-files.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
